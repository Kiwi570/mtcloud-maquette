<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTCloud · directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;600&family=Sora:wght@600;700&family=Inter:wght@400;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE : planche de travail sobre, pour choisir une direction en un coup d'œil.
   IDEA : trois ouvertures miniatures, chacune dans sa palette et sa typographie.
   PICTURE : dans chaque carte, l'ouverture de l'accueil en petit (titre, boîtier, souvenirs qui rentrent).
   COLOUR and TYPE : fond neutre, les couleurs vivent dans les aperçus et les nuanciers.
   LAYOUT : trois cartes côte à côte sur ordinateur, empilées sur téléphone. */
:root{color-scheme:light dark;--bg:light-dark(#f3f2ef,#16171a);--card:light-dark(#fff,#1f2024);--ink:light-dark(#1b1c1f,#ecebe8);--mute:light-dark(#5b5d63,#a9abb1);--line:light-dark(#e2e0db,#33353a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(4vw,16px);max-width:1440px;margin:0 auto}
h1{font:600 clamp(28px,3.4vw,42px)/1.08 Inter,sans-serif;margin:0 0 8px;text-wrap:balance}
.intro{color:var(--mute);max-width:70ch;margin:0}
.grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
@media(max-width:1080px){.grille{grid-template-columns:minmax(0,1fr)}}
.carte{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.carte.reco{outline:2px solid #d98a06;outline-offset:-2px}
.tete{padding:18px 20px 6px}
.tete b{display:block;font-size:20px;line-height:1.2}
.tete span{color:var(--mute);font-size:14px}
.badge{display:inline-block;background:#fdecc8;color:#7a4300;font-size:13px;font-weight:600;border-radius:99px;padding:2px 10px;margin-top:6px}
.apercu{position:relative;aspect-ratio:16/10;margin:12px 20px;border-radius:12px;overflow:hidden;background:var(--f1);color:var(--t1)}
.apercu .ciel{position:absolute;inset:0 0 52% 0;background:var(--ciel)}
.apercu h2{position:absolute;left:7%;top:16%;width:54%;margin:0;font:var(--titre);font-size:var(--fs,clamp(20px,2.2vw,30px));line-height:1.04;text-wrap:balance;z-index:2}
.apercu h2 em{color:var(--acc-t);font-style:var(--ital)}
.apercu .btn{position:absolute;left:7%;bottom:12%;background:var(--bouton);color:var(--bouton-t);font:600 12px/1 var(--texte);padding:9px 14px;border-radius:99px;z-index:2}
.boite{position:absolute;right:11%;bottom:20%;width:26%;aspect-ratio:2.2/1;border-radius:10px;background:var(--alu);box-shadow:0 14px 26px -12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7);z-index:2}
.boite::after{content:"";position:absolute;right:10%;top:42%;width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 10px 3px var(--led);animation:led 2.4s ease-in-out infinite}
.souv{position:absolute;width:9%;aspect-ratio:1;border-radius:4px;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.18);animation:descend 3.6s cubic-bezier(.5,0,.3,1) infinite;z-index:1}
.souv:nth-child(1){right:22%;background:linear-gradient(160deg,#7cc4e6,#2f7fb0);animation-delay:0s}
.souv:nth-child(2){right:15%;background:linear-gradient(160deg,#f6c27a,#e0703a);animation-delay:.6s}
.souv:nth-child(3){right:29%;background:linear-gradient(160deg,#a9d39a,#4f8f52);animation-delay:1.2s}
.souv:nth-child(4){right:19%;background:linear-gradient(160deg,#f2b4c4,#c25b7c);animation-delay:1.8s}
@keyframes descend{0%{top:-14%;opacity:0;transform:rotate(-8deg)}15%{opacity:1}70%{top:58%;opacity:1;transform:rotate(4deg) scale(.8)}100%{top:62%;opacity:0;transform:scale(.3)}}
@keyframes led{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.souv,.boite::after{animation:none}.souv{top:10%}}
.nuancier{display:flex;gap:6px;padding:0 20px;flex-wrap:wrap}
.nuancier div{flex:1 1 60px;border-radius:8px;border:1px solid var(--line);overflow:hidden;font-size:12px}
.nuancier i{display:block;height:38px}
.nuancier small{display:block;padding:4px 6px;color:var(--mute);line-height:1.3}
.typo{margin:14px 20px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px}
.typo .t{font-size:24px;line-height:1.1}
.typo .p{font-size:15px;color:var(--mute)}
dl{margin:12px 20px 20px;display:grid;gap:8px}
dt{font-weight:600;font-size:14px}
dd{margin:0;font-size:15px;color:var(--mute)}
</style>
</head>
<body>
<main class="band">
  <h1>MTCloud : trois directions pour la maquette</h1>
  <p class="intro">Chaque carte montre l'ouverture de l'accueil en miniature (titre, boîtier dessiné, souvenirs qui rentrent à la maison), la palette en codes couleur, les typographies et le plan. Les couleurs partent du logo : bouclier bleu nuit, M ambre, point rouge.</p>
  <section class="grille" id="grille"></section>
</main>
<script>
{
const D=[
{id:'A',reco:true,nom:'Rentrer à la maison',sous:'Clair et chaleureux, la lumière de la Riviera',
 v:{'--f1':'#F4EEE3','--t1':'#0F172A','--ciel':'linear-gradient(180deg,#cfe3ef,#F4EEE3)','--acc-t':'#A8500A','--ital':'italic','--bouton':'#0F172A','--bouton-t':'#FBD38D','--alu':'linear-gradient(180deg,#eef0f2,#b9bec5)','--led':'#F59E0B','--titre':'500 28px Fraunces,serif','--texte':'Figtree,sans-serif'},
 couleurs:[['#F4EEE3','Sable, fond dominant'],['#E9DFCC','Lin, second fond'],['#0F172A','Nuit du logo : bande, appel, pied'],['#F59E0B','Ambre : boutons sur nuit, LED'],['#A8500A','Ambre foncé : mots en titre sur clair']],
 typo:['Fraunces','Figtree'],
 champs:[['Ambiance','Un salon lumineux face à la mer, des souvenirs de famille, un artisan qui vient chez vous. Rassurant, simple, haut de gamme sans être froid.'],
 ['Plan de l\'accueil','Ouverture · « et si vos souvenirs n\'étaient plus chez un autre ? » · Photos (tri par visage, lieu, date) · Fichiers · trois promesses sur bande nuit · le boîtier · configurateur express · l\'artisan, de Bandol à Menton · comment ça se passe · appel final.'],
 ['L\'idée qui relie','La petite lumière ambre du boîtier : elle s\'allume quand les souvenirs sont rentrés, et c\'est d\'elle que part le voile entre les pages. Rien de plus.'],
 ['Animations','Intro : des vignettes de souvenirs quittent le ciel et entrent dans le boîtier, la LED s\'allume. Grille de photos qui se trie en direct, fichiers qui passent de l\'ordinateur au téléphone, boîtier qui tourne au défilement, côte tracée de Bandol à Menton, total qui se calcule.'],
 ['Favorite proche','Château Haut-Piquat (clair, chaleureux, belles images en grand) et Cool Canyoning (clair et nuit alternés).']]},
{id:'B',nom:'Le coffre de nuit',sous:'Sombre et premium, le boîtier comme un petit coffre lumineux',
 v:{'--f1':'#0B1220','--t1':'#EEF2F8','--ciel':'radial-gradient(80% 120% at 70% 0%,#1d2b48,#0B1220)','--acc-t':'#F59E0B','--ital':'normal','--bouton':'#F59E0B','--bouton-t':'#0B1220','--alu':'linear-gradient(180deg,#5d6676,#262d3a)','--led':'#F59E0B','--titre':'700 26px Sora,sans-serif','--fs':'clamp(16px,1.7vw,23px)','--texte':'Inter,sans-serif'},
 couleurs:[['#0B1220','Nuit, fond dominant'],['#131C2E','Nuit bleutée, second fond'],['#F3F4F6','Gris clair : configurateur, contact'],['#F59E0B','Ambre : boutons, mots en titre'],['#EF4444','Rouge du logo : LED seulement']],
 typo:['Sora','Inter'],
 champs:[['Ambiance','Nocturne, technique, précieux : le boîtier en 3D au centre de l\'écran, éclairé comme un objet de vitrine.'],
 ['Plan de l\'accueil','Ouverture 3D · d\'où viennent vos données (serveurs lointains) · ce qui rentre dans le boîtier · Photos et Fichiers · promesses · configurateur sur fond clair · l\'artisan · appel final.'],
 ['L\'idée qui relie','Les données arrivent en traînées de lumière depuis des serveurs lointains et se rangent dans le boîtier.'],
 ['Animations','Boîtier WebGL qui tourne et s\'ouvre au défilement, traînées de lumière, chiffres qui défilent, sections claires qui glissent sur la nuit.'],
 ['Point d\'attention','Plus froid et plus « technique » pour des familles ou des seniors ; le dernier projet en direction sombre a dû passer au clair après la v1.']]},
{id:'C',nom:'L\'album de famille',sous:'Clair et éditorial, le site se feuillette comme un album',
 v:{'--f1':'#FBFAF7','--t1':'#0F172A','--ciel':'linear-gradient(180deg,#e2edf7,#FBFAF7)','--acc-t':'#C2362F','--ital':'italic','--bouton':'#C2362F','--bouton-t':'#fff','--alu':'linear-gradient(180deg,#f4f5f6,#c9cdd2)','--led':'#EF4444','--titre':'400 32px "Instrument Serif",serif','--texte':'Manrope,sans-serif'},
 couleurs:[['#FBFAF7','Blanc chaud, fond dominant'],['#E2EDF7','Bleu ciel, second fond'],['#0F172A','Encre bleu nuit'],['#C2362F','Rouge du point : boutons, mots'],['#F59E0B','Ambre : petites touches']],
 typo:['Instrument Serif','Manrope'],
 champs:[['Ambiance','Lumineuse et tendre : des tirages photo qu\'on trie, qu\'on empile, des années qui défilent.'],
 ['Plan de l\'accueil','Ouverture album · vos souvenirs triés par visage, lieu, année · où ils sont aujourd\'hui · le boîtier, l\'album qui les garde · Fichiers · prix · l\'artisan · appel final.'],
 ['L\'idée qui relie','Des tirages photo qui se rangent d\'eux-mêmes au fil de la page.'],
 ['Animations','Tirages qui s\'empilent et se trient, années qui défilent, album qui se referme dans le boîtier.'],
 ['Point d\'attention','La partie Fichiers (documents, agendas) et le côté artisan technique passent au second plan.']]}
];
const g=document.getElementById('grille');
g.innerHTML=D.map(d=>`<article class="carte${d.reco?' reco':''}">
 <div class="tete"><b>${d.id} · ${d.nom}</b><span>${d.sous}</span>${d.reco?'<br><span class="badge">Recommandée</span>':''}</div>
 <div class="apercu" style="${Object.entries(d.v).map(([k,v])=>k+':'+v).join(';')}">
  <div class="ciel"></div><div class="souv"></div><div class="souv"></div><div class="souv"></div><div class="souv"></div>
  <h2>Vos photos et vos fichiers, <em>enfin chez vous.</em></h2><div class="boite"></div><span class="btn">Configurer mon cloud</span>
 </div>
 <div class="nuancier">${d.couleurs.map(([c,l])=>`<div><i style="background:${c}"></i><small><b>${c}</b><br>${l}</small></div>`).join('')}</div>
 <div class="typo"><div class="t" style="font-family:'${d.typo[0]}'">Titres : ${d.typo[0]}</div><div class="p" style="font-family:'${d.typo[1]}'">Texte : ${d.typo[1]}, sobre et lisible, 17 px sur ordinateur.</div></div>
 <dl>${d.champs.map(([t,v])=>`<dt>${t}</dt><dd>${v}</dd>`).join('')}</dl>
</article>`).join('');
}
</script>
</body>
</html>
